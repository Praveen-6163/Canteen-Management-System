[build]
  base = "frontend"
  publish = "dist"
  command = "npm install --legacy-peer-deps && npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://canteen-management-system-chi.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
